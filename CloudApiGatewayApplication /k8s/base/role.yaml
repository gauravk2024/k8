apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloud-api-gateway-role
  namespace: default
rules:
- apiGroups: [""]
  resources: ["services", "pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["get", "list", "watch"]