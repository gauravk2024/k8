apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cloud-api-gateway-rolebinding
  namespace: default
subjects:
- kind: ServiceAccount
  name: cloud-api-gateway-sa
  namespace: default
roleRef:
  kind: Role
  name: cloud-api-gateway-role
  apiGroup: rbac.authorization.k8s.io